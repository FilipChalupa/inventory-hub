name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint + typecheck + build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate on production dependencies only: dev-only tooling (test runners,
      # DOM shims) doesn't ship in the Docker image, and its advisories
      # generally require executing untrusted code in the test env. Fail on
      # high/critical in anything that reaches production.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t inventory-hub:ci .

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # main sat red for months without anyone noticing, so a red main now opens
  # (or comments on) a tracking issue — which notifies the repo's watchers —
  # and the next green run closes it.
  main-status:
    name: Report main status
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, audit, docker, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(results)
              .filter(([, r]) => r.result === 'failure' || r.result === 'cancelled')
              .map(([job]) => job);
            const label = 'ci-red-main';
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label,
            });
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            if (failed.length === 0) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `✅ main is green again at ${sha} ([run](${runUrl})).`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed',
                });
              }
              return;
            }
            const body = `❌ CI failed on main at ${sha}: **${failed.join(', ')}** ([run](${runUrl})).`;
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'CI is red on main', labels: [label], body,
              });
            }
